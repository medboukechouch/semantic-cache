services:
  db:
    image: ankane/pgvector:latest       # Postgres + pgvector extension pre-installed
    container_name: semantic-cache-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cache_user
      POSTGRES_PASSWORD: cache_pass
      POSTGRES_DB: semantic_cache
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: